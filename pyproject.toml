[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "systemd-hardening-kit"
version = "1.0.0"
description = "Hardened systemd drop-ins and a ranked systemd-analyze security report (text/JSON)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alii" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Systems Administration",
  "Topic :: Security",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7"]

[project.scripts]
systemd-hardening-kit = "systemd_hardening_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.sql"]
"systemd_hardening_kit" = ["dropins/*.conf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
