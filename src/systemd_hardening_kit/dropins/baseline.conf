# systemd-hardening-kit: baseline profile
# Safe for most daemons. Install as /etc/systemd/system/<unit>.d/50-hardening-baseline.conf
# and test the service afterwards (scripts/apply-dropin.sh does both, dry-run by default).
[Service]
# No privilege escalation through setuid binaries or file capabilities
NoNewPrivileges=yes
# Private /tmp and /var/tmp, removed when the service stops
PrivateTmp=yes
# /usr, /boot and /efi read-only; /etc stays writable (use the strict profile to lock it)
ProtectSystem=full
ProtectHome=read-only
# Kernel and control-group interfaces
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# Misc. kernel features rarely needed by services
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
KeyringMode=private
UMask=0027
