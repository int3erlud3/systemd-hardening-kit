# systemd-hardening-kit: strict profile (apply on top of baseline)
# Whole file system read-only except the service's own State/Cache/Logs/RuntimeDirectory=
# or explicit ReadWritePaths=. No capabilities, syscall allow-list, no device access.
# Not suitable for JIT runtimes (MemoryDenyWriteExecute) or services that need devices.
[Service]
ProtectSystem=strict
ProtectHome=yes
PrivateDevices=yes
DevicePolicy=closed
ProtectProc=invisible
ProcSubset=pid
RemoveIPC=yes
MemoryDenyWriteExecute=yes
# Drop every capability; re-add single ones in a later drop-in if needed
CapabilityBoundingSet=
AmbientCapabilities=
# Allow-list of syscalls typical for services, minus privileged and resource-control calls
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
